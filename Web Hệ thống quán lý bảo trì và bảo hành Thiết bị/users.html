<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Quản lý nhân viên và kỹ thuật viên - Hệ thống quản lý Bảo Trì và Bảo Hành Thiết Bị">
  <title>Quản lý Nhân viên - Hệ thống Quản lý Bảo Trì & Bảo Hành</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔧</text></svg>">
</head>
<body data-page="users" data-title="Quản lý Nhân viên">
  <main class="main-content" role="main">
    <div class="page-content">
      <div class="card mb-6">
        <div class="card-body" style="padding:var(--space-4) var(--space-6);">
          <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
            <div class="flex gap-3">
              <button class="btn btn-primary" id="btn-add-user">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                Thêm nhân viên
              </button>
              <button class="btn btn-outline" id="btn-export-users">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                Xuất Excel
              </button>
            </div>
            <div class="flex gap-2">
              <div style="position:relative;">
                <svg style="position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:hsl(var(--color-text-muted));pointer-events:none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="search" class="form-input" id="user-search" placeholder="Tên, email, điện thoại..." style="padding-left:38px;min-width:240px;">
              </div>
              <select class="form-select" id="filter-user-role" style="width:auto;min-width:160px;">
                <option value="">Tất cả vai trò</option>
                <option value="admin">Quản trị viên</option>
                <option value="manager">Quản lý</option>
                <option value="technician">Kỹ thuật viên</option>
                <option value="receptionist">Lễ tân/Tiếp nhận</option>
                <option value="accountant">Kế toán</option>
              </select>
              <select class="form-select" id="filter-user-status" style="width:auto;min-width:140px;">
                <option value="">Tất cả</option>
                <option value="active">Đang làm</option>
                <option value="inactive">Nghỉ việc</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
        <div class="stat-card">
          <div class="stat-card-header">
            <span class="stat-card-label">Tổng nhân viên</span>
            <div class="stat-card-icon primary"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle></svg></div>
          </div>
          <div class="stat-card-value" id="stat-total-users">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-header">
            <span class="stat-card-label">Kỹ thuật viên</span>
            <div class="stat-card-icon info"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg></div>
          </div>
          <div class="stat-card-value" id="stat-total-technicians">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-header">
            <span class="stat-card-label">Đang làm việc</span>
            <div class="stat-card-icon success"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 11 12 14 22 4"></polyline><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg></div>
          </div>
          <div class="stat-card-value" id="stat-active-users">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-header">
            <span class="stat-card-label">Nghỉ việc</span>
            <div class="stat-card-icon warning"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg></div>
          </div>
          <div class="stat-card-value" id="stat-inactive-users">—</div>
        </div>
      </div>

      <div class="card" id="users-table-container">
        <div class="card-body" style="text-align:center;padding:var(--space-12);"><div class="spinner" style="margin:0 auto;"></div><p style="margin-top:var(--space-4);color:hsl(var(--color-text-muted));">Đang tải danh sách nhân viên...</p></div>
      </div>
      <div id="users-pagination"></div>
    </div>
  </main>

  <!-- Add/Edit User Modal -->
  <div class="modal-overlay" id="user-modal-overlay" role="dialog" aria-modal="true" aria-labelledby="user-modal-title">
    <div class="modal" style="max-width:660px;">
      <div class="modal-header">
        <h2 class="modal-title" id="user-modal-title">Thêm nhân viên mới</h2>
        <button class="modal-close" data-modal-close aria-label="Đóng"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
      </div>
      <form id="user-form" novalidate>
        <div class="modal-body">
          <input type="hidden" name="id" id="user-id">
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="user-fullname">Họ và tên <span class="required">*</span></label>
              <input type="text" class="form-input" name="fullName" id="user-fullname" required placeholder="VD: Nguyễn Văn A">
              <div class="form-error"></div>
            </div>
            <div class="form-group">
              <label class="form-label" for="user-code">Mã nhân viên</label>
              <input type="text" class="form-input" name="code" id="user-code" placeholder="Tự động tạo" readonly>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="user-email-form">Email <span class="required">*</span></label>
              <input type="email" class="form-input" name="email" id="user-email-form" required placeholder="nhanvien@email.com">
              <div class="form-error"></div>
            </div>
            <div class="form-group">
              <label class="form-label" for="user-phone">Điện thoại <span class="required">*</span></label>
              <input type="tel" class="form-input" name="phone" id="user-phone" required placeholder="0901234567">
              <div class="form-error"></div>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="user-role-form">Vai trò <span class="required">*</span></label>
              <select class="form-select" name="role" id="user-role-form" required>
                <option value="">Chọn vai trò</option>
                <option value="admin">Quản trị viên</option>
                <option value="manager">Quản lý</option>
                <option value="technician">Kỹ thuật viên</option>
                <option value="receptionist">Lễ tân/Tiếp nhận</option>
                <option value="accountant">Kế toán</option>
              </select>
              <div class="form-error"></div>
            </div>
            <div class="form-group">
              <label class="form-label" for="user-status-form">Trạng thái</label>
              <select class="form-select" name="status" id="user-status-form">
                <option value="active">Đang làm</option>
                <option value="inactive">Nghỉ việc</option>
              </select>
            </div>
          </div>
          <div class="form-row" id="password-fields">
            <div class="form-group">
              <label class="form-label" for="user-username">Tên đăng nhập <span class="required">*</span></label>
              <input type="text" class="form-input" name="username" id="user-username" required placeholder="Tên đăng nhập">
              <div class="form-error"></div>
            </div>
            <div class="form-group">
              <label class="form-label" for="user-password">Mật khẩu <span class="required">*</span></label>
              <input type="password" class="form-input" name="password" id="user-password" required placeholder="Tối thiểu 6 ký tự">
              <div class="form-error"></div>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="user-address">Địa chỉ</label>
            <input type="text" class="form-input" name="address" id="user-address" placeholder="Địa chỉ nhân viên">
          </div>
          <div class="form-group">
            <label class="form-label" for="user-notes">Ghi chú</label>
            <textarea class="form-textarea" name="notes" id="user-notes" rows="2" placeholder="Chuyên môn, kinh nghiệm, ghi chú..."></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-modal-close>Hủy</button>
          <button type="submit" class="btn btn-primary" id="user-submit-btn"><span class="btn-text">Lưu nhân viên</span></button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/sidebar.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/pages/users.js"></script>
</body>
</html>
