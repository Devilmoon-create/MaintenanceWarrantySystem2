<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Cài đặt hệ thống - Hệ thống quản lý Bảo Trì và Bảo Hành Thiết Bị">
  <title>Cài đặt Hệ thống - Hệ thống Quản lý Bảo Trì & Bảo Hành</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔧</text></svg>">
</head>
<body data-page="settings" data-title="Cài đặt Hệ thống">
  <main class="main-content" role="main">
    <div class="page-content">
      <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
        <!-- Settings Sidebar -->
        <div class="card" style="height:fit-content;">
          <div class="card-body" style="padding:var(--space-2);">
            <nav class="settings-nav">
              <button class="nav-item active" data-settings-tab="general" style="width:100%;text-align:left;border:none;background:none;padding:var(--space-3) var(--space-4);border-radius:var(--radius-md);cursor:pointer;display:flex;align-items:center;gap:var(--space-3);font-size:var(--text-sm);color:hsl(var(--color-text));">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.32 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                Cài đặt chung
              </button>
              <button class="nav-item" data-settings-tab="store" style="width:100%;text-align:left;border:none;background:none;padding:var(--space-3) var(--space-4);border-radius:var(--radius-md);cursor:pointer;display:flex;align-items:center;gap:var(--space-3);font-size:var(--text-sm);color:hsl(var(--color-text));">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
                Thông tin cửa hàng
              </button>
              <button class="nav-item" data-settings-tab="notifications" style="width:100%;text-align:left;border:none;background:none;padding:var(--space-3) var(--space-4);border-radius:var(--radius-md);cursor:pointer;display:flex;align-items:center;gap:var(--space-3);font-size:var(--text-sm);color:hsl(var(--color-text));">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                Thông báo
              </button>
              <button class="nav-item" data-settings-tab="backup" style="width:100%;text-align:left;border:none;background:none;padding:var(--space-3) var(--space-4);border-radius:var(--radius-md);cursor:pointer;display:flex;align-items:center;gap:var(--space-3);font-size:var(--text-sm);color:hsl(var(--color-text));">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                Sao lưu dữ liệu
              </button>
            </nav>
          </div>
        </div>

        <!-- Settings Content -->
        <div class="lg:col-span-3">
          <!-- General Settings -->
          <div id="settings-general" class="settings-panel">
            <div class="card mb-6">
              <div class="card-header"><h2 class="card-title">Cài đặt chung</h2></div>
              <div class="card-body">
                <form id="settings-general-form">
                  <div class="form-group">
                    <label class="form-label">Ngôn ngữ hệ thống</label>
                    <select class="form-select" name="language" style="max-width:320px;">
                      <option value="vi" selected>Tiếng Việt</option>
                      <option value="en">English</option>
                    </select>
                  </div>
                  <div class="form-group">
                    <label class="form-label">Định dạng ngày</label>
                    <select class="form-select" name="dateFormat" style="max-width:320px;">
                      <option value="DD/MM/YYYY" selected>DD/MM/YYYY</option>
                      <option value="MM/DD/YYYY">MM/DD/YYYY</option>
                      <option value="YYYY-MM-DD">YYYY-MM-DD</option>
                    </select>
                  </div>
                  <div class="form-group">
                    <label class="form-label">Đơn vị tiền tệ</label>
                    <select class="form-select" name="currency" style="max-width:320px;">
                      <option value="VND" selected>VND (₫)</option>
                      <option value="USD">USD ($)</option>
                    </select>
                  </div>
                  <div class="form-group">
                    <label class="form-label">Số dòng hiển thị trên bảng</label>
                    <select class="form-select" name="pageSize" style="max-width:320px;">
                      <option value="10">10 dòng</option>
                      <option value="20" selected>20 dòng</option>
                      <option value="50">50 dòng</option>
                      <option value="100">100 dòng</option>
                    </select>
                  </div>
                  <button type="submit" class="btn btn-primary">Lưu thay đổi</button>
                </form>
              </div>
            </div>
          </div>

          <!-- Store Settings -->
          <div id="settings-store" class="settings-panel" style="display:none;">
            <div class="card mb-6">
              <div class="card-header"><h2 class="card-title">Thông tin cửa hàng/trung tâm</h2></div>
              <div class="card-body">
                <form id="settings-store-form">
                  <div class="form-group">
                    <label class="form-label">Tên cửa hàng/trung tâm <span class="required">*</span></label>
                    <input type="text" class="form-input" name="storeName" placeholder="VD: Trung tâm BảoTrìPro" style="max-width:400px;">
                  </div>
                  <div class="form-row" style="max-width:600px;">
                    <div class="form-group">
                      <label class="form-label">Điện thoại</label>
                      <input type="tel" class="form-input" name="storePhone" placeholder="0281234567">
                    </div>
                    <div class="form-group">
                      <label class="form-label">Email</label>
                      <input type="email" class="form-input" name="storeEmail" placeholder="info@baotripro.vn">
                    </div>
                  </div>
                  <div class="form-group">
                    <label class="form-label">Địa chỉ</label>
                    <input type="text" class="form-input" name="storeAddress" placeholder="Địa chỉ cửa hàng" style="max-width:500px;">
                  </div>
                  <div class="form-group">
                    <label class="form-label">Mã số thuế</label>
                    <input type="text" class="form-input" name="storeTaxCode" placeholder="0123456789" style="max-width:320px;">
                  </div>
                  <div class="form-group">
                    <label class="form-label">Chân trang hóa đơn</label>
                    <textarea class="form-textarea" name="invoiceFooter" rows="3" placeholder="Cảm ơn quý khách..." style="max-width:500px;"></textarea>
                  </div>
                  <button type="submit" class="btn btn-primary">Lưu thay đổi</button>
                </form>
              </div>
            </div>
          </div>

          <!-- Notification Settings -->
          <div id="settings-notifications" class="settings-panel" style="display:none;">
            <div class="card mb-6">
              <div class="card-header"><h2 class="card-title">Cài đặt thông báo</h2></div>
              <div class="card-body">
                <form id="settings-notifications-form">
                  <div class="form-check mb-4">
                    <input type="checkbox" class="form-check-input" name="notifyWarrantyExpiry" id="notify-warranty" checked>
                    <label class="form-check-label" for="notify-warranty">Cảnh báo thiết bị sắp hết bảo hành</label>
                  </div>
                  <div class="form-group" style="max-width:320px;margin-left:var(--space-8);">
                    <label class="form-label">Cảnh báo trước (ngày)</label>
                    <input type="number" class="form-input" name="warrantyWarningDays" value="30" min="1" max="365">
                  </div>
                  <div class="form-check mb-4">
                    <input type="checkbox" class="form-check-input" name="notifyMaintenanceDue" id="notify-maintenance" checked>
                    <label class="form-check-label" for="notify-maintenance">Nhắc lịch bảo trì định kỳ</label>
                  </div>
                  <div class="form-check mb-4">
                    <input type="checkbox" class="form-check-input" name="notifyLowStock" id="notify-stock" checked>
                    <label class="form-check-label" for="notify-stock">Cảnh báo linh kiện sắp hết tồn kho</label>
                  </div>
                  <div class="form-check mb-4">
                    <input type="checkbox" class="form-check-input" name="notifyTicketOverdue" id="notify-overdue" checked>
                    <label class="form-check-label" for="notify-overdue">Cảnh báo phiếu dịch vụ quá hạn</label>
                  </div>
                  <button type="submit" class="btn btn-primary">Lưu thay đổi</button>
                </form>
              </div>
            </div>
          </div>

          <!-- Backup Settings -->
          <div id="settings-backup" class="settings-panel" style="display:none;">
            <div class="card mb-6">
              <div class="card-header"><h2 class="card-title">Sao lưu & Khôi phục</h2></div>
              <div class="card-body">
                <p style="color:hsl(var(--color-text-muted));margin-bottom:var(--space-6);">Xuất toàn bộ dữ liệu để sao lưu hoặc chuyển sang hệ thống mới.</p>
                <div class="flex gap-3 mb-6">
                  <button class="btn btn-primary" id="btn-backup-export">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                    Xuất dữ liệu backup
                  </button>
                  <button class="btn btn-outline" id="btn-backup-import">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                    Nhập dữ liệu từ backup
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="toast-container" class="toast-container"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/sidebar.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/pages/settings.js"></script>
</body>
</html>
