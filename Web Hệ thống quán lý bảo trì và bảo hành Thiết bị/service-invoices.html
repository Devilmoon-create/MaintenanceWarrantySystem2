<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Hóa đơn dịch vụ bảo trì bảo hành - Hệ thống quản lý Bảo Trì và Bảo Hành Thiết Bị">
  <title>Hóa đơn Dịch vụ - Hệ thống Quản lý Bảo Trì & Bảo Hành</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔧</text></svg>">
</head>
<body data-page="service-invoices" data-title="Hóa đơn Dịch vụ">
  <main class="main-content" role="main">
    <div class="page-content">
      <div class="card mb-6">
        <div class="card-body" style="padding:var(--space-4) var(--space-6);">
          <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
            <div class="tabs" role="tablist">
              <button class="tab-btn active" role="tab" data-tab="all">Tất cả</button>
              <button class="tab-btn" role="tab" data-tab="paid">Đã thanh toán</button>
              <button class="tab-btn" role="tab" data-tab="unpaid">Chưa thanh toán</button>
              <button class="tab-btn" role="tab" data-tab="cancelled">Đã hủy</button>
            </div>
            <div class="flex gap-2">
              <div style="position:relative;">
                <svg style="position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:hsl(var(--color-text-muted));pointer-events:none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="search" class="form-input" id="invoice-search" placeholder="Mã hóa đơn, khách hàng..." style="padding-left:38px;min-width:240px;">
              </div>
              <input type="date" class="form-input" id="invoice-date-from" style="width:auto;">
              <input type="date" class="form-input" id="invoice-date-to" style="width:auto;">
              <button class="btn btn-outline" id="btn-export-invoices">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                Xuất Excel
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
        <div class="stat-card">
          <div class="stat-card-header">
            <span class="stat-card-label">Tổng hóa đơn</span>
            <div class="stat-card-icon primary"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg></div>
          </div>
          <div class="stat-card-value" id="stat-total-invoices">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-header">
            <span class="stat-card-label">Đã thanh toán</span>
            <div class="stat-card-icon success"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 11 12 14 22 4"></polyline><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg></div>
          </div>
          <div class="stat-card-value" id="stat-paid-invoices">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-header">
            <span class="stat-card-label">Chưa thanh toán</span>
            <div class="stat-card-icon warning"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg></div>
          </div>
          <div class="stat-card-value" id="stat-unpaid-invoices">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-header">
            <span class="stat-card-label">Tổng doanh thu</span>
            <div class="stat-card-icon info"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg></div>
          </div>
          <div class="stat-card-value" id="stat-invoice-revenue">—</div>
        </div>
      </div>

      <div class="card" id="invoices-table-container">
        <div class="card-body" style="text-align:center;padding:var(--space-12);"><div class="spinner" style="margin:0 auto;"></div><p style="margin-top:var(--space-4);color:hsl(var(--color-text-muted));">Đang tải hóa đơn...</p></div>
      </div>
      <div id="invoices-pagination"></div>
    </div>
  </main>

  <!-- View Invoice Detail Modal -->
  <div class="modal-overlay" id="invoice-detail-modal-overlay" role="dialog" aria-modal="true" aria-labelledby="invoice-detail-title">
    <div class="modal" style="max-width:700px;">
      <div class="modal-header">
        <h2 class="modal-title" id="invoice-detail-title">Chi tiết hóa đơn</h2>
        <button class="modal-close" data-modal-close aria-label="Đóng"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
      </div>
      <div class="modal-body" id="invoice-detail-content"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-modal-close>Đóng</button>
        <button type="button" class="btn btn-outline" id="btn-print-invoice">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
          In hóa đơn
        </button>
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/sidebar.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/pages/service-invoices.js"></script>
</body>
</html>
