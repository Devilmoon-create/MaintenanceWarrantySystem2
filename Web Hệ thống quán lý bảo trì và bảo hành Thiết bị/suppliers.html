<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Quản lý nhà cung cấp linh kiện - Hệ thống quản lý Bảo Trì và Bảo Hành Thiết Bị">
  <title>Quản lý Nhà cung cấp - Hệ thống Quản lý Bảo Trì & Bảo Hành</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔧</text></svg>">
</head>
<body data-page="suppliers" data-title="Quản lý Nhà cung cấp">

  <!-- Sidebar & Header injected by sidebar.js -->

  <main class="main-content" role="main">
    <div class="page-content">

      <!-- Toolbar -->
      <div class="card mb-6">
        <div class="card-body" style="padding: var(--space-4) var(--space-6);">
          <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
            <div class="flex gap-3">
              <button class="btn btn-primary" id="btn-add-supplier">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                Thêm nhà cung cấp
              </button>
              <button class="btn btn-outline" id="btn-export-suppliers">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                Xuất Excel
              </button>
            </div>
            <div style="position: relative;">
              <svg style="position:absolute; left:12px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:hsl(var(--color-text-muted)); pointer-events:none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
              <input type="search" class="form-input" id="supplier-search" placeholder="Tên, mã số thuế, liên hệ..." style="padding-left: 38px; min-width: 260px;">
            </div>
          </div>
        </div>
      </div>

      <!-- Suppliers Table -->
      <div class="card" id="suppliers-table-container">
        <div class="card-body" style="text-align:center; padding: var(--space-12);">
          <div class="spinner" style="margin: 0 auto;"></div>
          <p style="margin-top:var(--space-4); color:hsl(var(--color-text-muted));">Đang tải danh sách nhà cung cấp...</p>
        </div>
      </div>

      <div id="suppliers-pagination"></div>
    </div>
  </main>

  <!-- Add/Edit Supplier Modal -->
  <div class="modal-overlay" id="supplier-modal-overlay" role="dialog" aria-modal="true" aria-labelledby="supplier-modal-title">
    <div class="modal" style="max-width: 620px;">
      <div class="modal-header">
        <h2 class="modal-title" id="supplier-modal-title">Thêm nhà cung cấp</h2>
        <button class="modal-close" data-modal-close aria-label="Đóng">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <form id="supplier-form" novalidate>
        <div class="modal-body">
          <input type="hidden" name="id" id="supplier-id">
          <div class="form-group">
            <label class="form-label" for="supplier-name">Tên nhà cung cấp <span class="required">*</span></label>
            <input type="text" class="form-input" name="name" id="supplier-name" required placeholder="VD: Công ty TNHH Linh kiện XYZ">
            <div class="form-error"></div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="supplier-code">Mã nhà cung cấp</label>
              <input type="text" class="form-input" name="code" id="supplier-code" placeholder="Tự động tạo" readonly>
            </div>
            <div class="form-group">
              <label class="form-label" for="supplier-tax-code">Mã số thuế</label>
              <input type="text" class="form-input" name="taxCode" id="supplier-tax-code" placeholder="VD: 0101234567">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="supplier-phone">Điện thoại <span class="required">*</span></label>
              <input type="tel" class="form-input" name="phone" id="supplier-phone" required placeholder="VD: 0281234567">
              <div class="form-error"></div>
            </div>
            <div class="form-group">
              <label class="form-label" for="supplier-email">Email</label>
              <input type="email" class="form-input" name="email" id="supplier-email" placeholder="VD: ncc@email.com">
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="supplier-address">Địa chỉ</label>
            <input type="text" class="form-input" name="address" id="supplier-address" placeholder="Địa chỉ nhà cung cấp">
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="supplier-contact-person">Người liên hệ</label>
              <input type="text" class="form-input" name="contactPerson" id="supplier-contact-person" placeholder="Tên người phụ trách">
            </div>
            <div class="form-group">
              <label class="form-label" for="supplier-payment-terms">Điều khoản thanh toán</label>
              <select class="form-select" name="paymentTerms" id="supplier-payment-terms">
                <option value="immediate">Trả ngay</option>
                <option value="15days">NET 15 ngày</option>
                <option value="30days">NET 30 ngày</option>
                <option value="60days">NET 60 ngày</option>
                <option value="custom">Thỏa thuận</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="supplier-notes">Ghi chú</label>
            <textarea class="form-textarea" name="notes" id="supplier-notes" rows="2" placeholder="Mặt hàng cung cấp chính, điều khoản đặc biệt..."></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-modal-close>Hủy</button>
          <button type="submit" class="btn btn-primary" id="supplier-submit-btn">
            <span class="btn-text">Lưu nhà cung cấp</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/sidebar.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/pages/suppliers.js"></script>
</body>
</html>
