<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Quản lý loại thiết bị - Hệ thống quản lý Bảo Trì và Bảo Hành Thiết Bị">
  <title>Loại Thiết bị - Hệ thống Quản lý Bảo Trì & Bảo Hành</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔧</text></svg>">
</head>
<body data-page="categories" data-title="Loại Thiết bị">
  <main class="main-content" role="main">
    <div class="page-content">
      <div class="card mb-6">
        <div class="card-body" style="padding: var(--space-4) var(--space-6);">
          <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
            <button class="btn btn-primary" id="btn-add-category">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
              Thêm loại thiết bị
            </button>
            <div style="position:relative;">
              <svg style="position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:hsl(var(--color-text-muted));pointer-events:none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
              <input type="search" class="form-input" id="category-search" placeholder="Tìm loại thiết bị..." style="padding-left:38px;min-width:260px;">
            </div>
          </div>
        </div>
      </div>
      <div class="card" id="categories-table-container">
        <div class="card-body" style="text-align:center;padding:var(--space-12);"><div class="spinner" style="margin:0 auto;"></div><p style="margin-top:var(--space-4);color:hsl(var(--color-text-muted));">Đang tải...</p></div>
      </div>
      <div id="categories-pagination"></div>
    </div>
  </main>

  <div class="modal-overlay" id="category-modal-overlay" role="dialog" aria-modal="true" aria-labelledby="category-modal-title">
    <div class="modal" style="max-width:500px;">
      <div class="modal-header">
        <h2 class="modal-title" id="category-modal-title">Thêm loại thiết bị</h2>
        <button class="modal-close" data-modal-close aria-label="Đóng"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
      </div>
      <form id="category-form" novalidate>
        <div class="modal-body">
          <input type="hidden" name="id" id="category-id">
          <div class="form-group">
            <label class="form-label" for="category-name">Tên loại thiết bị <span class="required">*</span></label>
            <input type="text" class="form-input" name="name" id="category-name" required placeholder="VD: Máy tính, Máy in, Server...">
            <div class="form-error"></div>
          </div>
          <div class="form-group">
            <label class="form-label" for="category-code">Mã loại</label>
            <input type="text" class="form-input" name="code" id="category-code" placeholder="VD: PC, PRINTER, SVR...">
          </div>
          <div class="form-group">
            <label class="form-label" for="category-description">Mô tả</label>
            <textarea class="form-textarea" name="description" id="category-description" rows="3" placeholder="Mô tả chi tiết loại thiết bị..."></textarea>
          </div>
          <div class="form-group">
            <label class="form-label" for="category-warranty-period">Thời hạn bảo hành mặc định (tháng)</label>
            <input type="number" class="form-input" name="defaultWarrantyMonths" id="category-warranty-period" min="0" step="1" value="12">
          </div>
          <div class="form-group">
            <label class="form-label" for="category-maintenance-period">Chu kỳ bảo trì định kỳ (tháng)</label>
            <input type="number" class="form-input" name="maintenanceCycleMonths" id="category-maintenance-period" min="0" step="1" value="6">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-modal-close>Hủy</button>
          <button type="submit" class="btn btn-primary" id="category-submit-btn"><span class="btn-text">Lưu</span></button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/sidebar.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/pages/categories.js"></script>
</body>
</html>
