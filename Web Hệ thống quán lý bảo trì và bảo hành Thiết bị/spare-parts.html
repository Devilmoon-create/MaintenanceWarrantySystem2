<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Quản lý kho linh kiện vật tư - Hệ thống quản lý Bảo Trì và Bảo Hành Thiết Bị">
  <title>Kho Linh kiện & Vật tư - Hệ thống Quản lý Bảo Trì & Bảo Hành</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔧</text></svg>">
</head>
<body data-page="spare-parts" data-title="Kho Linh kiện & Vật tư">

  <!-- Sidebar & Header injected by sidebar.js -->

  <main class="main-content" role="main">
    <div class="page-content">

      <!-- Toolbar -->
      <div class="card mb-6">
        <div class="card-body" style="padding: var(--space-4) var(--space-6);">
          <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
            <div class="flex flex-wrap gap-3">
              <button class="btn btn-primary" id="btn-add-part">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                Thêm linh kiện
              </button>
              <a href="import-invoices.html" class="btn btn-success">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                Nhập kho
              </a>
              <button class="btn btn-outline" id="btn-export-parts">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                Xuất Excel
              </button>
            </div>
            <div class="flex flex-wrap gap-2">
              <!-- Tìm kiếm sản phẩm/linh kiện: theo mã, tên, ghi chú -->
              <div style="position: relative;">
                <svg style="position:absolute; left:12px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:hsl(var(--color-text-muted)); pointer-events:none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="search" class="form-input" id="part-search" placeholder="Mã, tên, model, ghi chú..." style="padding-left: 38px; min-width: 260px;">
              </div>
              <select class="form-select" id="filter-part-category" style="width: auto; min-width: 160px;">
                <option value="">Tất cả danh mục</option>
              </select>
              <select class="form-select" id="filter-part-stock" style="width: auto; min-width: 150px;">
                <option value="">Tất cả tồn kho</option>
                <option value="in_stock">Còn hàng</option>
                <option value="low_stock">Sắp hết hàng</option>
                <option value="out_of_stock">Hết hàng</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <!-- Stock Summary Cards - Tương tự "Thống kê kho" -->
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
        <div class="stat-card">
          <div class="stat-card-header">
            <span class="stat-card-label">Tổng linh kiện</span>
            <div class="stat-card-icon primary"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path></svg></div>
          </div>
          <div class="stat-card-value" id="stat-total-parts">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-header">
            <span class="stat-card-label">Tổng tồn kho</span>
            <div class="stat-card-icon success"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 11 12 14 22 4"></polyline><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg></div>
          </div>
          <div class="stat-card-value" id="stat-in-stock">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-header">
            <span class="stat-card-label">Sắp hết hàng</span>
            <div class="stat-card-icon warning"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg></div>
          </div>
          <div class="stat-card-value" id="stat-low-stock">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-header">
            <span class="stat-card-label">Giá trị kho</span>
            <div class="stat-card-icon info"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg></div>
          </div>
          <div class="stat-card-value" id="stat-inventory-value">—</div>
        </div>
      </div>

      <!-- Parts Table -->
      <div class="card" id="parts-table-container">
        <div class="card-body" style="text-align:center; padding: var(--space-12);">
          <div class="spinner" style="margin: 0 auto;"></div>
          <p style="margin-top:var(--space-4); color:hsl(var(--color-text-muted));">Đang tải danh mục linh kiện...</p>
        </div>
      </div>

      <div id="parts-pagination"></div>
    </div>
  </main>

  <!-- Add/Edit Part Modal - "Thêm sản phẩm" / "Quản lý sản phẩm" -->
  <div class="modal-overlay" id="part-modal-overlay" role="dialog" aria-modal="true" aria-labelledby="part-modal-title">
    <div class="modal" style="max-width: 680px;">
      <div class="modal-header">
        <h2 class="modal-title" id="part-modal-title">Thêm linh kiện mới</h2>
        <button class="modal-close" data-modal-close aria-label="Đóng">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <form id="part-form" novalidate>
        <div class="modal-body">
          <input type="hidden" name="id" id="part-id">
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="part-code">Mã linh kiện</label>
              <input type="text" class="form-input" name="code" id="part-code" placeholder="Tự động tạo" readonly>
            </div>
            <div class="form-group">
              <label class="form-label" for="part-category-form">Danh mục <span class="required">*</span></label>
              <select class="form-select" name="categoryId" id="part-category-form" required>
                <option value="">Chọn danh mục</option>
              </select>
              <div class="form-error"></div>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="part-name">Tên linh kiện <span class="required">*</span></label>
            <input type="text" class="form-input" name="name" id="part-name" required placeholder="VD: RAM DDR4 8GB Samsung">
            <div class="form-error"></div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="part-model">Model / Phiên bản</label>
              <input type="text" class="form-input" name="model" id="part-model" placeholder="VD: M378A1K43CB2-CTD">
            </div>
            <div class="form-group">
              <label class="form-label" for="part-unit">Đơn vị tính</label>
              <select class="form-select" name="unit" id="part-unit">
                <option value="cái">Cái</option>
                <option value="chiếc">Chiếc</option>
                <option value="bộ">Bộ</option>
                <option value="hộp">Hộp</option>
                <option value="cuộn">Cuộn</option>
                <option value="mét">Mét</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <!-- Quản lý giá bán - "Quản lý giá bán" -->
            <div class="form-group">
              <label class="form-label" for="part-cost-price">Giá nhập (VND) <span class="required">*</span></label>
              <input type="number" class="form-input" name="costPrice" id="part-cost-price" required min="0" step="1000" placeholder="0">
              <div class="form-error"></div>
            </div>
            <div class="form-group">
              <label class="form-label" for="part-sell-price">Giá bán/dịch vụ (VND)</label>
              <input type="number" class="form-input" name="sellPrice" id="part-sell-price" min="0" step="1000" placeholder="0">
              <p class="form-help">Giá tính vào phiếu dịch vụ</p>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="part-min-stock">Tồn kho tối thiểu</label>
              <input type="number" class="form-input" name="minStock" id="part-min-stock" min="0" step="1" value="5" placeholder="5">
              <p class="form-help">Cảnh báo khi dưới mức này</p>
            </div>
            <div class="form-group">
              <label class="form-label" for="part-initial-stock">Số lượng nhập ban đầu</label>
              <input type="number" class="form-input" name="initialStock" id="part-initial-stock" min="0" step="1" placeholder="0">
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="part-supplier-form">Nhà cung cấp chính</label>
            <select class="form-select" name="supplierId" id="part-supplier-form">
              <option value="">Chọn nhà cung cấp</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="part-description">Mô tả / Ghi chú</label>
            <textarea class="form-textarea" name="description" id="part-description" rows="2" placeholder="Thông tin thêm về linh kiện..."></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-modal-close>Hủy</button>
          <button type="submit" class="btn btn-primary" id="part-submit-btn">
            <span class="btn-text">Lưu linh kiện</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Adjust Stock Modal - "Thay đổi số lượng sản phẩm" -->
  <div class="modal-overlay" id="stock-adjust-modal-overlay" role="dialog" aria-modal="true" aria-labelledby="stock-adjust-title">
    <div class="modal" style="max-width: 440px;">
      <div class="modal-header">
        <h2 class="modal-title" id="stock-adjust-title">Điều chỉnh số lượng tồn kho</h2>
        <button class="modal-close" data-modal-close aria-label="Đóng">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="adjust-part-id">
        <p style="font-weight:600; margin-bottom:var(--space-3);">Linh kiện: <span id="adjust-part-name" style="color:hsl(var(--color-primary));"></span></p>
        <p style="color:hsl(var(--color-text-muted)); margin-bottom:var(--space-4);">Tồn kho hiện tại: <strong id="adjust-current-stock"></strong></p>
        <div class="form-group">
          <label class="form-label" for="adjust-type">Loại điều chỉnh</label>
          <select class="form-select" id="adjust-type">
            <option value="add">Nhập thêm</option>
            <option value="remove">Xuất bớt</option>
            <option value="set">Đặt chính xác</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="adjust-quantity">Số lượng <span class="required">*</span></label>
          <input type="number" class="form-input" id="adjust-quantity" min="0" step="1" placeholder="0" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="adjust-reason">Lý do điều chỉnh</label>
          <textarea class="form-textarea" id="adjust-reason" rows="2" placeholder="VD: Kiểm kho, hàng về, xuất cho phiếu..."></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-modal-close>Hủy</button>
        <button type="button" class="btn btn-primary" id="btn-adjust-confirm">Xác nhận điều chỉnh</button>
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/sidebar.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/pages/spare-parts.js"></script>
</body>
</html>
